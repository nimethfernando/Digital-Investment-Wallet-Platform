# ==============================================================================
# AVORA BANK - Institutional Production Nginx Reverse Proxy & Security Gateway
# ==============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance Tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Client Request & Body Limits (Accommodates KYC doc & proof uploads up to 25MB)
    client_max_body_size 25M;
    client_body_buffer_size 128k;

    # Rate Limiting Zones (DDoS & Brute Force Prevention)
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=40r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=addr_limit:10m;

    # High Performance Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # Enterprise Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Upstream Services (Docker Internal Network)
    upstream api_service {
        server server:5000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream web_service {
        server web:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # HTTP Server (Port 80)
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Connection Limit
        limit_conn addr_limit 50;

        # Health Check Endpoint
        location /health {
            access_log off;
            return 200 '{"status":"UP","gateway":"Avora-Nginx-Gateway"}';
            add_header Content-Type application/json;
        }

        # Authentication Routes (Strict Rate Limiting: 5 requests/sec burst 10)
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;

            proxy_pass http://api_service;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # General API Routes
        location /api/ {
            limit_req zone=general_limit burst=30 nodelay;

            proxy_pass http://api_service;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # Uploads / Static Media Handled by Backend
        location /uploads/ {
            proxy_pass http://api_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_cache_valid 200 30d;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # Next.js Static Assets Caching (_next/static)
        location /_next/static/ {
            proxy_pass http://web_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_cache_valid 200 365d;
            expires 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Next.js Frontend Application
        location / {
            limit_req zone=general_limit burst=50 nodelay;

            proxy_pass http://web_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }
}

