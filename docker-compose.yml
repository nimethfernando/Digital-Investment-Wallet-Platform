services:
  # ----------------------------------------------------------------------------
  # NGINX REVERSE PROXY & GATEWAY (Port 80/443)
  # ----------------------------------------------------------------------------
  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: avora-reverse-proxy
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - uploads_data:/app/uploads:ro
    depends_on:
      server:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - avora-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ----------------------------------------------------------------------------
  # AVORA BANK EXPRESS API ENGINE
  # ----------------------------------------------------------------------------
  server:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    container_name: avora-api-engine
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET:-avora_jwt_super_secret_production_key_2026}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-avora_jwt_refresh_super_secret_production_key_2026}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - UPLOAD_DIR=/app/uploads
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-900000}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-100}
    volumes:
      - uploads_data:/app/uploads
    networks:
      - avora-network
    logging:
      driver: "json-file"
      options:
        max-size: "30m"
        max-file: "5"

  # ----------------------------------------------------------------------------
  # AVORA BANK NEXT.JS FRONTEND WEB (Standalone Mode)
  # ----------------------------------------------------------------------------
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: avora-web-portal
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - INTERNAL_API_URL=http://server:5000
      - NEXT_PUBLIC_API_URL=/api/v1
    depends_on:
      server:
        condition: service_healthy
    networks:
      - avora-network
    logging:
      driver: "json-file"
      options:
        max-size: "30m"
        max-file: "5"

volumes:
  uploads_data:
    name: avora_uploads_storage

networks:
  avora-network:
    name: avora-network
    driver: bridge
